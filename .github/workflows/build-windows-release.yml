name: Build Windows x64 and Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the setup to GitHub Releases (signing is optional)"
        type: boolean
        default: false
      rhino:
        description: "Build native Rhino 3DM import with openNURBS"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: artisanaxis-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Prepare CMake and Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # VS 2026 requires CMake 4.2 or newer.
          python -m pip install --disable-pip-version-check 'cmake>=4.2,<5'
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare CMake.' }
          $pythonScripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $pythonScripts >> $env:GITHUB_PATH
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }
          if (!(Test-Path -LiteralPath $iscc)) { throw "Inno Setup not found: $iscc" }
          "ARTISAN_ISCC=$iscc" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build, CTest and package
        id: package
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish }}
          BUILD_RHINO: ${{ inputs.rhino }}
          IS_PRIVATE_REPO: ${{ github.event.repository.private }}
          SIGNING_PFX_BASE64: ${{ secrets.ARTISANAXIS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.ARTISANAXIS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PUBLISH_RELEASE -eq 'true' -and $env:IS_PRIVATE_REPO -eq 'true') {
            throw 'The unauthenticated GitHub Releases update channel requires a public repository.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP ('artisanaxis-' + [Guid]::NewGuid().ToString('N') + '.pfx')
          $certificate = $null
          try {
            if ($env:SIGNING_PFX_BASE64) {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
              $pwd = if ($env:SIGNING_PFX_PASSWORD) {
                ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
              } else { [Security.SecureString]::new() }
              $certificate = @(Import-PfxCertificate -FilePath $pfx -Password $pwd -CertStoreLocation Cert:\CurrentUser\My |
                Where-Object { $_.HasPrivateKey }) | Select-Object -First 1
              if (!$certificate) { throw 'No signing certificate with private key.' }
            }
            $buildParameters = @{
              QtRoot = $env:QT_ROOT_DIR
              InnoCompiler = $env:ARTISAN_ISCC
              UpdateRepository = $env:GITHUB_REPOSITORY
              Rhino3dm = $env:BUILD_RHINO -eq 'true'
            }
            if ($certificate) { $buildParameters.CertificateThumbprint = $certificate.Thumbprint }
            & ./scripts/Build-Windows.ps1 @buildParameters
            $feed = Get-Content -LiteralPath dist/update-feed.json -Raw | ConvertFrom-Json
            "version=$($feed.version)" >> $env:GITHUB_OUTPUT
          } finally {
            if (Test-Path -LiteralPath $pfx) { Remove-Item -LiteralPath $pfx -Force }
            if ($certificate) { Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $certificate.Thumbprint) }
          }

      - name: Smoke test deployed setup and application startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP ('artisanaxis-smoke-' + [Guid]::NewGuid().ToString('N'))
          $marker = $dir + '.ready'
          $token = [Guid]::NewGuid().ToString('N')
          $installed = Start-Process -FilePath (Resolve-Path 'dist/Setup.exe').Path -PassThru -Wait -ArgumentList @(
            '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $dir + '"'))
          if ($installed.ExitCode -ne 0) { throw "Setup exit code $($installed.ExitCode)" }
          $app = $null
          try {
            # Test deployed DLLs without the Qt kit on PATH.
            Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
            Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            if (!(Test-Path -LiteralPath (Join-Path $dir 'CAMWorker.exe'))) { throw 'Missing CAMWorker.exe' }
            $app = Start-Process -FilePath (Join-Path $dir 'ArtisanAxis.exe') -WorkingDirectory $dir -PassThru -ArgumentList (
              '--update-health-file "' + $marker + '" --update-health-token ' + $token)
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "Deployed application exited with $($app.ExitCode)" }
              if (Test-Path -LiteralPath $marker) { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if (!(Test-Path -LiteralPath $marker) -or [IO.File]::ReadAllText($marker) -cne $token) {
              throw 'Deployed application did not confirm startup.'
            }
            if ($app.WaitForExit(3000)) { throw 'Deployed application did not stay running.' }
          } finally {
            if ($app -and !$app.HasExited) { Stop-Process -Id $app.Id -Force }
            $uninstaller = Get-ChildItem -LiteralPath $dir -Filter 'unins*.exe' | Select-Object -First 1
            if ($uninstaller) {
              Start-Process -FilePath $uninstaller.FullName -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
            }
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ArtisanAxis-v${{ steps.package.outputs.version }}-windows-x64
          path: |
            dist/Setup.exe
            dist/update-feed.json
            dist/Setup.exe.sha256
          if-no-files-found: error

  release:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ArtisanAxis-v${{ needs.build.outputs.version }}-windows-x64
          path: dist

      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check Setup.exe.sha256
          gh release create "v$VERSION" Setup.exe update-feed.json Setup.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --title "ArtisanAxis CAM Pro v$VERSION" --generate-notes --latest
